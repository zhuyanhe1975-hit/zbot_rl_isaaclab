seed: 42
device: cuda:0
num_steps_per_env: 48
init_at_random_ep_len: true
max_iterations: 100
empirical_normalization: {}
obs_groups:
  student:
  - policy
  teacher:
  - teacher
clip_actions: null
check_for_nan: true
save_interval: 25
experiment_name: zbot_6dof_periodic_walking_student_quality
run_name: student_blended_pilot
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: /home/yhzhu/myWorks_vips/zbot_rl_isaaclab/logs/rsl_rl/zbot_6dof_periodic_walking_student_quality/2026-09-27_14-05-59_student_quality_distillation/model_275.pt
class_name: DistillationRunner
student:
  class_name: RNNModel
  hidden_dims:
  - 128
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.03
    std_type: scalar
  rnn_type: gru
  rnn_hidden_dim: 128
  rnn_num_layers: 1
teacher:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.7
    std_type: scalar
algorithm:
  class_name: zbot_rl_isaaclab.student_distillation:GuidedDistillation
  num_learning_epochs: 2
  learning_rate: 0.0001
  gradient_length: 16
  max_grad_norm: 1.0
  optimizer: adam
  loss_type: huber
  teacher_fraction_start: 1.0
  teacher_fraction_end: 0.7
  teacher_fraction_decay_updates: 600
policy: {}
