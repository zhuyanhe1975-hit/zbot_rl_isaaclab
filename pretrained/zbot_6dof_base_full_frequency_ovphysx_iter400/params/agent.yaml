seed: 42
device: cuda:0
num_steps_per_env: 48
init_at_random_ep_len: true
max_iterations: 1200
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: null
check_for_nan: true
save_interval: 50
experiment_name: zbot_6dof_base
run_name: full_frequency_from_300
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: /home/yhzhu/myWorks_vips/zbot_rl_isaaclab/logs/rsl_rl/zbot_6dof_base/2026-09-24_21-17-19/model_300.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.7
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0005
  schedule: fixed
  gamma: 0.995
  lam: 0.97
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
